spring:
  application:
    name: account
  profiles:
    active: dev
  config:
    # no "optional:" prefix on purpose: fail fast instead of silently starting with unbound properties
    #replace localhost with container name of the config server which is "configserver"
    import: configserver:${CONFIG_SERVER_URL:http://configserver:8071}
  datasource:
    url: jdbc:postgresql://postgres:5432/account_db
    username: admin
    password: admin
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect